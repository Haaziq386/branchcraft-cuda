name: CUDA compile and artifact checks

on:
  push:
  pull_request:

jobs:
  cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM 120 CUDA binary
        run: make CUDA_ARCH=sm_120
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python source
        run: python3 -m compileall -q python tests examples
      - name: Rebuild benchmark figures from checked-in data
        run: |
          python3 scripts/make_charts.py benchmarks/decode_results.csv
          git diff --exit-code -- assets
      - name: Verify HTML and SVG syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree
          for path in Path('docs').glob('*.html'):
              HTMLParser().feed(path.read_text(encoding='utf-8'))
          for path in Path('assets').glob('*.svg'):
              ElementTree.parse(path)
          print('HTML and SVG parse checks passed')
          PY
      - name: Validate checked-in model parity artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('benchmarks/vllm_parity.json').read_text())
          assert run['backends']['TRITON_ATTN'] == run['backends']['CUSTOM']
          assert run['exact_token_parity'] and run['custom_fast_path_observed']
          assert run['prefill_fallback_observed']
          assert len(run['prompts']) == len(run['backends']['CUSTOM']) == 3
          print('Model parity artifact is internally consistent')
          PY
