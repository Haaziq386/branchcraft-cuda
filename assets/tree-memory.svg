<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Live KV representation by request count"><title>Live KV representation by request count</title><desc>Shared prefix tree uses far fewer live KV bytes than expanded paths</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#dce8f5}.muted{fill:#8fa6bf}.title{font-size:24px;font-weight:700}.small{font-size:12px}.label{font-size:14px;font-weight:600}</style><rect width="920" height="470" rx="22" fill="#0d1727"/><text x="40" y="48" class="title">The memory cost of repeating a prefix</text><text x="40" y="75" class="muted small">1024-token prefix · seven-node tree · live KV bytes, excluding allocator reserve</text><text x="40" y="151" class="label">1 request</text><rect x="180" y="129" width="10.3" height="23" rx="5" fill="#42d6b0"/><text x="200.3" y="146" class="small">4.0 MiB</text><rect x="180" y="160" width="72.5" height="23" rx="5" fill="#477fdd"/><text x="262.5" y="177" class="small">28.4 MiB</text><text x="40" y="256" class="label">4 requests</text><rect x="180" y="234" width="10.5" height="23" rx="5" fill="#42d6b0"/><text x="200.5" y="251" class="small">4.1 MiB</text><rect x="180" y="265" width="290.0" height="23" rx="5" fill="#477fdd"/><text x="480.0" y="282" class="small">113.8 MiB</text><text x="40" y="361" class="label">8 requests</text><rect x="180" y="339" width="10.8" height="23" rx="5" fill="#42d6b0"/><text x="200.8" y="356" class="small">4.2 MiB</text><rect x="180" y="370" width="580.0" height="23" rx="5" fill="#477fdd"/><text x="770.0" y="387" class="small">227.5 MiB</text><rect x="40" y="430" width="13" height="13" rx="2" fill="#42d6b0"/><text x="62" y="441" class="small">shared prefix + draft nodes</text><rect x="310" y="430" width="13" height="13" rx="2" fill="#477fdd"/><text x="332" y="441" class="small">seven expanded sequences per request</text></svg>